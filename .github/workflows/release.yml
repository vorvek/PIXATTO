name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package
        shell: pwsh
        run: |
          $packageName = "Pixelizer-${env:RELEASE_TAG}-windows-x64"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "build/ninja-release/pixelizer.exe" $packageDir
          Copy-Item "README.md" $packageDir
          Copy-Item "CHANGELOG.md" $packageDir
          Copy-Item "THIRD_PARTY.md" $packageDir
          Copy-Item "LICENSE" $packageDir
          Copy-Item "assets" $packageDir -Recurse
          & "C:\msys64\ucrt64\bin\strip.exe" --strip-unneeded (Join-Path $packageDir "pixelizer.exe")

          $assetPath = "dist/$packageName.zip"
          Compress-Archive -Path "$packageDir/*" -DestinationPath $assetPath -Force
          "ASSET_PATH=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-windows-x64
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            wayland-protocols

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package
        run: |
          package_name="Pixelizer-${RELEASE_TAG}-linux-x64"
          package_dir="dist/${package_name}"
          mkdir -p "$package_dir"

          cp build/ninja-release/pixelizer "$package_dir/"
          cp README.md CHANGELOG.md THIRD_PARTY.md LICENSE "$package_dir/"
          cp -R assets "$package_dir/"
          strip "$package_dir/pixelizer" || true

          tar -czf "dist/${package_name}.tar.gz" -C dist "$package_name"
          echo "ASSET_PATH=dist/${package_name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-linux-x64
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ninja

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package
        run: |
          package_name="Pixelizer-${RELEASE_TAG}-macos"
          package_dir="dist/${package_name}"
          mkdir -p "$package_dir"

          cp build/ninja-release/pixelizer "$package_dir/"
          cp README.md CHANGELOG.md THIRD_PARTY.md LICENSE "$package_dir/"
          cp -R assets "$package_dir/"
          strip "$package_dir/pixelizer" || true

          ditto -c -k --keepParent "$package_dir" "dist/${package_name}.zip"
          echo "ASSET_PATH=dist/${package_name}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-macos
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
      - macos

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Pixelizer ${RELEASE_TAG}"
          notes="$(cat <<'NOTES'
          Automated desktop builds for Pixelizer.

          Assets:
          - Windows x64
          - Linux x64
          - macOS
          NOTES
          )"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
